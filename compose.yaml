# SQL Server para desarrollo local.
#
# Sustituye a LocalDB (ADR-0015): el mismo motor que usan las pruebas de integración y el mismo
# que hay detras de Azure SQL, en vez de una variante de escritorio con sus propias manias.
#
#   docker compose up -d      arranca
#   docker compose down       para, conservando los datos
#   docker compose down -v    para y borra la base entera, para empezar de cero
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: topcut-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Contraseña de desarrollo, deliberadamente en claro: esta base solo existe en tu máquina,
      # solo escucha en localhost y no contiene nada real. Nunca la reutilices en ningún otro sitio.
      MSSQL_SA_PASSWORD: "TopCut-Local-2026"
      MSSQL_PID: Developer
    ports:
      # 11433 y no 1433 para no chocar con una instalación de SQL Server que ya tengas.
      - "11433:1433"
    volumes:
      # Volumen con nombre: los datos sobreviven a "docker compose down".
      - topcut-sqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  topcut-sqldata:
