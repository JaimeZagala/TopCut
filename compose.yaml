# PostgreSQL para desarrollo local.
#
# El mismo motor y la misma versión mayor que Neon en producción y que las pruebas de integración
# (ADR-0039), en vez de un servidor instalado a mano con su propia configuración.
#
#   docker compose up -d      arranca
#   docker compose down       para, conservando los datos
#   docker compose down -v    para y borra la base entera, para empezar de cero
services:
  postgres:
    image: postgres:17
    container_name: topcut-postgres
    environment:
      POSTGRES_DB: topcut
      POSTGRES_USER: topcut
      # Contraseña de desarrollo, deliberadamente en claro: esta base solo existe en tu máquina,
      # solo escucha en localhost y no contiene nada real. Nunca la reutilices en ningún otro sitio.
      POSTGRES_PASSWORD: "TopCut-Local-2026"
    ports:
      # 15432 y no 5432 para no chocar con un PostgreSQL que ya tengas instalado.
      - "127.0.0.1:15432:5432"
    volumes:
      # Volumen con nombre: los datos sobreviven a "docker compose down".
      - topcut-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topcut -d topcut"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  topcut-pgdata:
